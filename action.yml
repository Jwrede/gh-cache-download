name: Download Actions cache entry
description: Fetch the raw archive of a GitHub Actions cache entry by key and upload it as a workflow artifact
author: Jwrede
branding:
  icon: download
  color: blue

inputs:
  key:
    description: Exact cache key.
    required: true
  version:
    description: >
      Cache version as listed by the REST API (GET /repos/{owner}/{repo}/actions/caches).
      When empty, it is looked up by key, which needs the actions:read permission.
    required: false
    default: ''
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: cache-archive
  retention-days:
    description: Days to keep the artifact.
    required: false
    default: '1'
  token:
    description: Token for the version lookup.
    required: false
    default: ${{ github.token }}

outputs:
  archive-path:
    description: Path of the downloaded archive on the runner.
    value: ${{ steps.fetch.outputs.archive-path }}
  version:
    description: Cache version that was downloaded.
    value: ${{ steps.fetch.outputs.version }}
  size:
    description: Archive size in bytes.
    value: ${{ steps.fetch.outputs.size }}

runs:
  using: composite
  steps:
    - id: fetch
      uses: actions/github-script@v9
      env:
        CACHE_KEY: ${{ inputs.key }}
        CACHE_VERSION: ${{ inputs.version }}
        FETCH_CACHE_JS: ${{ github.action_path }}/fetch-cache.js
      with:
        github-token: ${{ inputs.token }}
        script: |
          const run = require(process.env.FETCH_CACHE_JS);
          await run({ github, context, core });
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.fetch.outputs.archive-path }}
        compression-level: 0
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
